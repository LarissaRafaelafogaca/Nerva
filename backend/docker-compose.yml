services:
  postgres:
    image: postgres:16-alpine
    container_name: nerva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nerva
      POSTGRES_PASSWORD: nerva
      POSTGRES_DB: nerva
    ports:
      - "5432:5432"
    volumes:
      - nerva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerva -d nerva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nerva_pgdata:
